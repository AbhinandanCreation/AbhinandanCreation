<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Abhinandan Creation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" spreadMethod="reflect">
      <stop offset="0" stop-color="#0b3a68"/>
      <stop offset="0.5" stop-color="#1a4f91"/>
      <stop offset="1" stop-color="#0a2c52"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0.35 0.2; 0 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f5b942"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="330" rx="22"/></clipPath>
    <mask id="sewn">
      <path d="M -20 262 C 180 222, 330 300, 520 258 S 860 214, 1040 256 S 1230 290, 1300 248" fill="none" stroke="#fff" stroke-width="8" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
        <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.75;1" dur="8s" repeatCount="indefinite"/>
      </path>
    </mask>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="330" fill="url(#bg)"/>
    
    <circle cx="120" cy="70" r="46" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 -14; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="90" r="60" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 14; 0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="250" r="34" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 14; 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="230" r="28" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 -14; 0 0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="60" r="22" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 14; 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1220" cy="230" r="18" fill="#ffffff" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; -18 14; 0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- faint thread grid -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <line x1="0" y1="0" x2="-120" y2="330"/><line x1="85" y1="0" x2="-35" y2="330"/><line x1="170" y1="0" x2="50" y2="330"/><line x1="255" y1="0" x2="135" y2="330"/><line x1="340" y1="0" x2="220" y2="330"/><line x1="425" y1="0" x2="305" y2="330"/><line x1="510" y1="0" x2="390" y2="330"/><line x1="595" y1="0" x2="475" y2="330"/><line x1="680" y1="0" x2="560" y2="330"/><line x1="765" y1="0" x2="645" y2="330"/><line x1="850" y1="0" x2="730" y2="330"/><line x1="935" y1="0" x2="815" y2="330"/><line x1="1020" y1="0" x2="900" y2="330"/><line x1="1105" y1="0" x2="985" y2="330"/><line x1="1190" y1="0" x2="1070" y2="330"/><line x1="1275" y1="0" x2="1155" y2="330"/>
    </g>
    <!-- stitch line revealed behind the needle -->
    <path d="M -20 262 C 180 222, 330 300, 520 258 S 860 214, 1040 256 S 1230 290, 1300 248" fill="none" stroke="#f5b942" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round" mask="url(#sewn)">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- needle -->
    <g>
      <animateMotion path="M -20 262 C 180 222, 330 300, 520 258 S 860 214, 1040 256 S 1230 290, 1300 248" dur="8s" keyPoints="0;1;1" keyTimes="0;0.75;1" calcMode="linear" rotate="auto" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.74;0.8;1" dur="8s" repeatCount="indefinite"/>
      <path d="M -34 0 L 10 -2.2 Q 16 0 10 2.2 Z" fill="#e6edf3"/>
      <ellipse cx="-27" cy="0" rx="4" ry="1.3" fill="#0b3a68"/>
    </g>
    <!-- waves -->
    <g opacity="0.16" fill="#ffffff">
      <path d="M0 300 Q 160 270 320 300 T 640 300 T 960 300 T 1280 300 T 1600 300 T 1920 300 T 2240 300 T 2560 300 V 330 H 0 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -640 0" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.10" fill="#ffffff">
      <path d="M0 308 Q 200 286 400 308 T 800 308 T 1200 308 T 1600 308 T 2000 308 T 2400 308 V 330 H 0 Z">
        <animateTransform attributeName="transform" type="translate" values="-400 0; 0 0" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- text -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="640" y="92" font-size="16" font-weight="600" letter-spacing="7" fill="#f5b942" opacity="0">
        IN-HOUSE MIS · DIGITAL OPERATIONS
        <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1s" fill="freeze"/>
      </text>
      <text x="640" y="168" font-size="70" font-weight="800" letter-spacing="5" fill="url(#shine)" opacity="0">
        ABHINANDAN CREATION
        <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" begin="0.4s" dur="1.2s" fill="freeze"/>
      </text>
      <text x="640" y="212" font-size="22" fill="#cfe0f5" opacity="0">
        Apparel manufacturing, run on software we build ourselves
        <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="1.2s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
