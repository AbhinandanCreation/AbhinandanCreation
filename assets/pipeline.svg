    <g>
      <animateMotion path="M 98 89 H 1102" dur="7s" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.78;0.84;1" dur="7s" repeatCount="indefinite"/>
